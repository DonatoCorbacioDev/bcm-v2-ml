name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # OWASP Secrets Management: no secret reaches GitHub. Same job as the
  # backend's: gitleaks on the pushed commits (the whole history was scanned
  # clean on 2026-11-17).
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: Test · Sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # OWASP API8: a dependency with a known vulnerability fails the build,
      # instead of waiting in an unmerged Dependabot pull request.
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Test with coverage
        run: pytest --cov=app --cov-report=xml
        env:
          DB_URL: sqlite:///./test.db
          CORS_ORIGINS: http://localhost:3000

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
